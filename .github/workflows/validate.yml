name: Validate control tables

# Stage 2 edits the control tables unattended, so this runs on every PR and
# push that touches the baseline. Catches broken table structure, missing or
# malformed Drafted dates, and NIST identifiers that do not exist, before any
# of them reach main.

on:
  pull_request:
    paths:
      - "docs/**"
      - "automation/check_tables.py"
      - "automation/check_nist.py"
      - "automation/state/nist-ids.json"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "automation/check_tables.py"
      - "automation/check_nist.py"
      - "automation/state/nist-ids.json"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Control table structure and Drafted dates
        run: python3 automation/check_tables.py

      # Runs against the committed ID inventory, so no network and no
      # dependency on csrc.nist.gov, which 403s automated clients.
      - name: NIST identifiers resolve against NIST's OSCAL catalogs
        run: python3 automation/check_nist.py
