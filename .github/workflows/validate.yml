name: Validate control tables

# The drafting job edits the control tables unattended, so this guards every
# PR: broken table structure, missing or malformed Drafted dates, and NIST
# identifiers that do not exist.
#
# Deliberately unfiltered by path. A required status check that only runs for
# some paths never reports on the others, and a required check that never
# reports blocks the pull request forever. Both validators take under a second,
# so running them on every PR costs nothing and makes this check safe to mark
# required in a branch ruleset.

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Control table structure and Drafted dates
        run: python3 automation/check_tables.py

      # Runs against the committed ID inventory, so no network and no
      # dependency on csrc.nist.gov, which 403s automated clients.
      - name: NIST identifiers resolve against NIST's OSCAL catalogs
        run: python3 automation/check_nist.py
